name: crashlab
label: CrashLab
kind: standalone
manifest_version: 1
version: 0.5.2
description: >
  Run a saved browser journey, suppress a response after the server has
  committed, inspect the persisted records, and compare the same case against
  a buggy and a repaired application. A failed check is evidence, not a pass.
author: Iyanda Abdulqodir Adedolapo
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - crashlab_validate
  - crashlab_run
  - crashlab_compare
  - crashlab_list
  - crashlab_campaign_list
  - crashlab_campaign_validate
  - crashlab_campaign_run
  - crashlab_prepare
  - crashlab_experiment_run
  - crashlab_experiment_status
  - crashlab_experiment_watch
  - crashlab_experiment_report
  - crashlab_experiment_export
  - crashlab_experiment_import
provides_hooks:
  - pre_verify
  - pre_tool_call
  - post_approval_response
