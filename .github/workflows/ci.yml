name: CrashLab checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Locate Chromium for the browser runner
        # The runner takes CHROME_PATH first and falls back to its own browser
        # discovery; exporting the installed build keeps the browser acceptance
        # job's coverage explicit in the log instead of silently skipping.
        run: |
          chromium_path="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          test -x "$chromium_path"
          echo "CHROME_PATH=$chromium_path" >> "$GITHUB_ENV"
          echo "Using Chromium at $chromium_path"
      - run: python -m pip install -r requirements-test.txt
      - name: Unit and integrity tests
        run: python -m unittest discover -v
        env:
          CRASHLAB_DATA_DIR: ${{ runner.temp }}/crashlab
      - name: Browser acceptance
        run: python -m unittest -v test_browser_integrity test_recovery_campaign test_recovery_contract
        env:
          CRASHLAB_BROWSER_TESTS: '1'
          CRASHLAB_DATA_DIR: ${{ runner.temp }}/crashlab-browser
